# Neo4flix stack. Start with: docker compose --env-file .env up -d --build
name: neo4flix

services:
  # The single graph database shared by every microservice. Each service owns
  # its own node labels and relationship types (see README "Graph model").
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4flix-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      # Browser UI and Bolt are bound to localhost only: never expose the DB publicly.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

volumes:
  neo4j-data:

networks:
  backend:
