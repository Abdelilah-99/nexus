spring.config.import=optional:file:./.env[.properties]

spring.application.name=discovery

server.port=${PORT:8761}

# Match the standalone server identity to its own service URL so it is not a replica.
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}
